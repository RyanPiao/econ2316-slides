<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Vote</title>
<!-- Scan-to-vote page (27 Oct 2026). GENERATED by strip_notes.py from tools/vote/index.html into every
     course repository's v/ folder: never edit a copy in econ2316-slides / econ3916-slides /
     econ5200-slides, the next publish overwrites it.
     URL: v/#<code> (a short code from v/polls.json, e.g. #9-2) or v/#<poll id>[@<deck folder>],
     optional ?sec=am|pm (passed through from the projector; poll.js reads it for the session key).
     The question and its options are read from the public deck itself, so nothing is kept twice.
     Votes go through poll.js exactly as on the deck: same device id, NUID check-in, session key,
     voting window and one-vote-per-device index. This page never opens or closes a poll. -->
<style>
  :root { --ink:#1f2937; --muted:#6b7280; --line:#e5e7eb; --bg:#f8f6f3; --card:#ffffff; --accent:#1e3a8a; --ok:#047857; --bad:#b91c1c; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font: 18px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; -webkit-text-size-adjust: 100%; }
  main { max-width: 560px; margin: 0 auto; padding: 18px 16px 40px; }
  .course { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; }
  h1 { font-size: 22px; line-height: 1.3; margin: 0 0 10px; }
  .prompt { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin: 0 0 16px; font-size: 17px; }
  .prompt p { margin: 0 0 6px; } .prompt p:last-child { margin: 0; }
  .opts { display: flex; flex-direction: column; gap: 12px; }
  .opt { display: flex; gap: 12px; align-items: center; width: 100%; min-height: 64px; padding: 12px 14px;
    background: var(--card); color: var(--ink); border: 2px solid var(--line); border-radius: 14px;
    font: inherit; text-align: left; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .opt:active { transform: scale(.99); }
  .opt .k { flex: 0 0 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 19px; background: #eef2ff; color: var(--accent); }
  .opt.picked { border-color: var(--accent); background: #eef2ff; }
  .opt[disabled] { opacity: .55; }
  .opt.picked[disabled] { opacity: 1; }
  .status { margin: 16px 0 0; min-height: 26px; font-weight: 700; text-align: center; }
  .status.ok { color: var(--ok); } .status.bad { color: var(--bad); }
  .other { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  .other input, .other button { font-size: 20px !important; }
  .foot { margin-top: 26px; text-align: center; font-size: 14px; color: var(--muted); }
  .foot a { color: var(--accent); }
  .msg { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  img, svg { max-width: 100%; height: auto; }
</style>
</head>
<body>
<main id="app"><p class="msg">Loading the question&hellip;</p></main>
<script>
(function () {
  var app = document.getElementById("app");
  var course = (location.pathname.match(/\/(econ\d{4})-slides\//) || [])[1] || "";
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function fail(html) { app.innerHTML = '<p class="msg">' + html + '</p><p class="foot"><a href="../">All slides for this course</a></p>'; }
  function clean(node) {           // keep the words, drop the deck's inline styling and scripts
    [].forEach.call(node.querySelectorAll("script, style, aside, .fragment.wc-step"), function (x) { x.remove(); });
    [].forEach.call(node.querySelectorAll("*"), function (x) { x.removeAttribute("style"); x.removeAttribute("class"); x.removeAttribute("onclick"); });
    [].forEach.call(node.querySelectorAll("i"), function (x) { if (!x.textContent.trim()) x.remove(); });
    return node;
  }
  var key = decodeURIComponent((location.hash || "").replace(/^#/, ""));
  if (!key) { fail("This link is missing the question code. Scan the code on the screen again."); return; }

  fetch("polls.json", { cache: "no-store" }).then(function (r) { return r.ok ? r.json() : {}; }).catch(function () { return {}; })
  .then(function (map) {
    var codes = map.codes || {}, byPoll = map.byPoll || {};
    var hit = codes[key], deck, pid;
    if (hit) { deck = hit[0]; pid = hit[1]; }
    else {
      var at = key.split("@"); pid = at[0];
      var code = byPoll[pid]; deck = at[1] || (code && codes[code] && codes[code][0]);
    }
    if (!deck || !pid) { fail("This question is not in the slides yet. Ask in class, or open the slides instead."); return; }
    return fetch("../" + deck + "/", { cache: "no-store" }).then(function (r) { if (!r.ok) throw 0; return r.text(); })
      .then(function (html) { show(deck, pid, new DOMParser().parseFromString(html, "text/html")); })
      .catch(function () { fail("Could not load the slides. Check your connection and scan again."); });
  });

  function show(deck, pid, doc) {
    var sel = '[data-poll-id="' + pid.replace(/"/g, "") + '"]';
    var grid = doc.querySelector(".poll-grid" + sel);
    var box = grid || doc.querySelector(".poll-number" + sel + "[data-poll-voting]") || doc.querySelector(sel + "[data-poll-voting]");
    var sec = box && box.closest("section");
    var slideLink = "../" + deck + "/" + (sec && sec.id ? "#/" + sec.id : "");
    if (!box) { fail('This question could not be found. <a href="' + slideLink + '">Open the slide</a>.'); return; }
    var h2 = sec && sec.querySelector("h2");
    var title = h2 ? clean(h2.cloneNode(true)).textContent.replace(/\s+/g, " ").trim() : "Poll";
    var prompt = document.createElement("div"); prompt.className = "prompt";
    var multi = !grid && !!sec && sec.querySelectorAll(".poll-number[data-poll-voting][data-poll-id]").length > 1;
    if (sec) [].forEach.call(sec.querySelectorAll("p"), function (p) {
      if (p.closest(".poll-grid, aside, .poll-results-chart") || !p.textContent.trim()) return;
      if (multi && p.parentNode && p.parentNode.querySelector(".poll-number[data-poll-voting]")) return;   // a box's own label: shown above that box
      if (p.compareDocumentPosition(box) & Node.DOCUMENT_POSITION_FOLLOWING || box.contains(p)) {
        if (!box.contains(p) && prompt.children.length < 3) prompt.appendChild(clean(p.cloneNode(true)));
      }
    });
    var name = (doc.title || "").replace(/\s*[—|-].*$/, "");
    var html = '<p class="course">' + esc(course.toUpperCase().replace("ECON", "ECON ")) + (name ? " &middot; " + esc(name) : "") + "</p>" +
               "<h1>" + esc(title) + "</h1>";
    app.innerHTML = html;
    if (prompt.children.length) app.appendChild(prompt);
    var status = document.createElement("p"); status.className = "status"; status.setAttribute("aria-live", "polite");

    if (grid) {                                   // A-D: big buttons, one tap votes
      var opts = document.createElement("div"); opts.className = "opts";
      [].forEach.call(grid.querySelectorAll(".poll-option[data-choice]"), function (o) {
        var ch = o.getAttribute("data-choice");
        var body = clean(o.cloneNode(true));
        var lead = body.firstElementChild;     // the deck writes "<strong>A)</strong> text"
        if (lead && /^\s*[A-H]\)\s*$/.test(lead.textContent)) lead.remove();
        var b = document.createElement("button"); b.type = "button"; b.className = "opt";
        b.innerHTML = '<span class="k">' + esc(ch) + '</span><span class="t">' + body.innerHTML.trim() + "</span>";
        b.addEventListener("click", function () {
          if (!window.Poll || !Poll.cast) { status.className = "status bad"; status.textContent = "Still loading, try again in a second."; return; }
          status.className = "status"; status.textContent = "Sending…";
          Poll.cast(pid, ch, function (res) {
            if (res === "ok" || res === "dup") {
              [].forEach.call(opts.children, function (x) { x.disabled = true; });
              if (res === "ok") b.classList.add("picked");
              status.className = "status ok";
              status.textContent = res === "ok" ? "✓ Vote recorded: " + ch : "✓ You have already voted on this question.";
            } else if (res === "closed") {
              status.className = "status bad"; status.textContent = "Voting isn't open for this question yet.";
            } else {
              status.className = "status bad"; status.textContent = "That didn't go through. Tap again.";
            }
          });
        });
        opts.appendChild(b);
      });
      app.appendChild(opts);
    } else if (!box.classList.contains("poll-number")) {   // a word cloud or a deck-drawn card: the slide draws it
      var go = document.createElement("p"); go.className = "msg";
      go.innerHTML = 'This question is answered on the slide itself. <a href="' + slideLink + '"><strong>Open the slide to answer</strong></a>';
      app.appendChild(go);
    } else {                                       // typed number: poll.js draws the box and Send
      // every typed box on the slide, in slide order, each under its own label (3916 T12 room-trip asks
      // minutes, miles and initials on one slide; linking only the first left the room's pairs unmatched)
      var boxes = sec ? [].slice.call(sec.querySelectorAll(".poll-number[data-poll-voting][data-poll-id]")) : [];
      if (boxes.indexOf(box) < 0) boxes = [box];
      boxes.forEach(function (bx) {
        var wrap = document.createElement("div"); wrap.className = "other";
        var lab = boxes.length > 1 && bx.parentNode && bx.parentNode.querySelector("p");
        if (lab) wrap.appendChild(clean(lab.cloneNode(true)));
        var mine = document.importNode(bx, true);
        mine.removeAttribute("style");
        wrap.appendChild(mine); app.appendChild(wrap);
      });
    }
    app.appendChild(status);
    var foot = document.createElement("p"); foot.className = "foot";
    foot.innerHTML = '<a href="' + slideLink + '">Open this slide</a>';
    app.appendChild(foot);

    // poll.js last, so it finds the number box above; data-checkin = the same NUID check-in as the deck
    var s = document.createElement("script");
    s.src = "../poll.js"; s.setAttribute("data-checkin", "");
    s.onload = typeset;
    document.body.appendChild(s);
  }
  function typeset() {             // math in a question renders as on the slide
    if (!/\\\(|\\\[|\$\$/.test(app.textContent)) return;
    window.MathJax = { tex: { inlineMath: [["\\(", "\\)"]] }, svg: { fontCache: "global" } };
    var m = document.createElement("script");
    m.src = "https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"; m.async = true;
    document.head.appendChild(m);
  }
})();
</script>
</body>
</html>
